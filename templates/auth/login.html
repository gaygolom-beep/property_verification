{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head auth-head-with-photo" style="--auth-photo: url('{{ url_for('static', filename='demo_photos/demo_4.jpg') }}');">
      <span class="seal seal-lg mb-2"><i class="bi bi-check-lg"></i></span>
      <h4 class="text-white mb-1 mt-2">Welcome back</h4>
      <p class="text-white-50 small mb-0">Sign in to continue verification work</p>
    </div>
    <div class="auth-body">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 text-center small text-muted">
        No account? <a href="{{ url_for('auth.register') }}">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
