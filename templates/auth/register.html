{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head auth-head-with-photo" style="--auth-photo: url('{{ url_for('static', filename='demo_photos/demo_2.jpg') }}');">
      <span class="seal seal-lg mb-2"><i class="bi bi-file-earmark-check"></i></span>
      <h4 class="text-white mb-1 mt-2">Create your account</h4>
      <p class="text-white-50 small mb-0">Start submitting properties for verification</p>
    </div>
    <div class="auth-body">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" required autofocus placeholder="Jordan Patel">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100">Create Account</button>
      </form>
      <p class="mt-3 text-center small text-muted">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
      </p>
      <p class="text-center small text-muted mb-0">Note: the very first account created becomes the admin.</p>
    </div>
  </div>
</div>
{% endblock %}
